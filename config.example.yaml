# yaml-language-server: $schema=./dist/config.schema.json
server:
  addr: :8080
  db_path: rogerd.db
  db_encryption_key: ${ROGERD_ENCRYPTION_KEY}

auth:
  jwt_private_key: ${ROGERD_JWT_PRIVATE_KEY}
  jwt_public_key: ${ROGERD_JWT_PUBLIC_KEY}
  providers:
    google:
      client_id: ${GOOGLE_CLIENT_ID}
      client_secret: ${GOOGLE_CLIENT_SECRET}
      auth_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      scopes:
        - openid
        - email
        - profile

features:
  core:auth:
    providers:
      - id: google
        name: Google
        kind: google
  core:projects:
    maxProjectsPerAccount: 10
    minProjectNameLength: 3
    maxProjectNameLength: 64
    supportedProjectKinds:
      - game
  core:environments:
    maxEnvironmentsPerProject: 5
    minEnvironmentNameLength: 3
    maxEnvironmentNameLength: 64
    maxPlacesPerUniverse: 20
  core:targets:
    maxTargetsPerProject: 150
    minTargetNameLength: 1
    maxTargetNameLength: 64
    supportedTargetKinds:
      - place
  core:storage:
    maxStorageObjectsPerAccount: 3
    minStorageNameLength: 3
    maxStorageNameLength: 64
    supportedStorageKinds:
      - S3
      - internal
  core:deployments:
    maxDeploymentsPerProject: 50
    maxPlacesPerDeployment: 10
    minVersionLength: 1
    maxVersionLength: 64
    maxPlaceFileSizeBytes: 5368709120
