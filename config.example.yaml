# yaml-language-server: $schema=./dist/config.schema.json
server:
  name: Official Roger Node
  description: The official Roger node powered by rogerd
  version: v0.2.1
  addr: :8080
  server_url: http://localhost:8080
  db_path: rogerd.db
  db_encryption_key: ${ROGERD_ENCRYPTION_KEY}

auth:
  jwt_private_key_path: ./keys/private.pem
  jwt_public_key_path: ./keys/public.pem
  allowed_redirect_uris:
    - "http://localhost:*/*"
    - "http://127.0.0.1:*/*"
  providers:
    google:
      client_id: ${GOOGLE_CLIENT_ID}
      client_secret: ${GOOGLE_CLIENT_SECRET}
      auth_url: https://accounts.google.com/o/oauth2/v2/auth
      callback_path: /auth/callback/google
      token_url: https://oauth2.googleapis.com/token
      scopes:
        - openid
        - email
        - profile

features:
  core:auth:
    providers:
      - id: google
        name: Google
        kind: google
  core:projects:
    maxProjectsPerAccount: 10
    minProjectNameLength: 3
    maxProjectNameLength: 64
    supportedProjectKinds:
      - game
  core:environments:
    maxEnvironmentsPerProject: 5
    minEnvironmentNameLength: 3
    maxEnvironmentNameLength: 64
    maxPlacesPerUniverse: 20
  core:targets:
    maxTargetsPerProject: 150
    minTargetNameLength: 1
    maxTargetNameLength: 64
    supportedTargetKinds:
      - place
  core:credentials:
    maxCredentialsPerProject: 5
    minCredentialNameLength: 3
    maxCredentialNameLength: 64
    supportedCredentialKinds:
      - api-key
  core:storage:
    maxStorageObjectsPerAccount: 3
    minStorageNameLength: 3
    maxStorageNameLength: 64
    supportedStorageKinds:
      - S3
      - internal
  core:deployments:
    maxDeploymentsPerProject: 50
    maxPlacesPerDeployment: 10
    minVersionLength: 1
    maxVersionLength: 64
    maxPlaceFileSizeBytes: 5368709120
